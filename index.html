<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamerCard - Your Universal Sports & Gaming Passport</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Canvas-Confetti for achievement celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            orbitron: ['Orbitron', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              accent: '#00ffcc',
              gold: '#ffd700',
              dark: '#0b0f19',
              card: '#151c2c'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    /* Holographic Shimmer Effect for Gamer Cards */
    .holo-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      position: relative;
      overflow: hidden;
    }
    .holo-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 0%,
        rgba(0, 255, 204, 0.05) 30%,
        rgba(99, 102, 241, 0.15) 50%,
        rgba(255, 0, 128, 0.05) 70%,
        transparent 100%
      );
      transform: rotate(30deg);
      pointer-events: none;
      animation: holoShift 8s ease infinite alternate;
    }
    @keyframes holoShift {
      0% { transform: translateY(-10%) rotate(25deg); }
      100% { transform: translateY(10%) rotate(35deg); }
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-accent selection:text-black">

  <!-- Top Navigation Bar -->
  <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('landing')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-400 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-id-card text-xl"></i>
        </div>
        <span class="font-orbitron font-extrabold text-xl tracking-wider text-white">GAMER<span class="text-brand-accent">CARD</span></span>
      </div>

      <!-- Navigation Actions -->
      <nav id="nav-actions" class="flex items-center space-x-3">
        <!-- JS dynamically renders standard links or logged-in user profile -->
      </nav>
    </div>
  </header>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- MAIN VIEW CONTAINER (Renders views dynamically) -->
  <main id="app-view" class="flex-grow">
    <!-- Content injected by JavaScript -->
  </main>

  <!-- Global Modal Popup Container -->
  <div id="global-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div id="modal-content" class="bg-gray-900 border border-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <!-- Modal dynamically populated -->
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-gray-800 bg-gray-950 py-6 text-center text-xs text-gray-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <span class="font-orbitron text-gray-400 font-semibold">GAMERCARD</span> &copy; 2026 — Local-First Sports & Gaming Identity System.
      </div>
      <div class="flex space-x-4">
        <span class="hover:text-gray-300 cursor-pointer" onclick="showToast('Local Storage Active', 'info')"><i class="fa-solid fa-database text-brand-accent"></i> LocalStorage Engine</span>
        <span class="hover:text-gray-300 cursor-pointer" onclick="navigateTo('landing')">Privacy Safe</span>
      </div>
    </div>
  </footer>

  <!-- Application Logic -->
  <script>
    // --- APP STATE ENGINE ---
    const STORAGE_KEYS = {
      USERS: 'gc_users_db',
      CURRENT_USER: 'gc_session_user'
    };

    // Default Pre-populated Sports / Game Categories
    const DEFAULT_GAMES = [
      { id: 'cricket', name: 'Cricket', type: 'Physical Sport', icon: 'fa-cricket-bat-ball', types: ['Self Practice/Nets', 'Solo Match', 'Team League', 'Friendly Tournament'] },
      { id: 'football', name: 'Football / Soccer', type: 'Physical Sport', icon: 'fa-futbol', types: ['5-a-side Nets', 'Team Match', 'Practice Drills', 'Club Cup'] },
      { id: 'valorant', name: 'Valorant', type: 'Esports', icon: 'fa-gamepad', types: ['Competitive Rank', 'Unrated', 'Custom Team Match', 'Deathmatch'] },
      { id: 'chess', name: 'Chess', type: 'Mind Sport', icon: 'fa-chess', types: ['Blitz 3+0', 'Rapid 10 min', 'Over the Board', 'Tournament'] }
    ];

    // Seed Data Demo Users if empty
    function seedInitialData() {
      if (!localStorage.getItem(STORAGE_KEYS.USERS)) {
        const demoUser = {
          username: 'Striker99',
          name: 'Alex Mercer',
          email: 'alex@gamer.io',
          password: 'password123',
          bio: 'All-rounder cricketer & Valorant Duelist main. Always playing weekend tournaments!',
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
          title: 'Master Tactician',
          level: 12,
          xp: 2450,
          customGames: [...DEFAULT_GAMES],
          achievements: [
            { id: 1, gameId: 'cricket', gameName: 'Cricket', matchType: 'Team League', title: '54* Runs Off 32 Balls', details: 'Scored winning runs against Lions XI in T20 league', score: '54 runs', outcome: 'Victory', date: '2026-10-15' },
            { id: 2, gameId: 'cricket', matchType: 'Self Practice/Nets', gameName: 'Cricket', title: 'Spin Bowling Practice', details: 'Nets session focusing on leg breaks', score: '2 hrs', outcome: 'Completed', date: '2026-10-20' },
            { id: 3, gameId: 'football', gameName: 'Football / Soccer', matchType: '5-a-side Nets', title: 'Hat-trick in Turf Match', details: 'Scored 3 goals in 5v5 friendly match', score: '3 Goals', outcome: 'Victory', date: '2026-10-24' },
            { id: 4, gameId: 'valorant', gameName: 'Valorant', matchType: 'Competitive Rank', title: 'Ace clutch on Ascent', details: 'Clutched 1v4 round on A site using Reyna', score: '28/12 KDA', outcome: 'Victory', date: '2026-10-28' }
          ]
        };
        localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify([demoUser]));
      }
    }

    // Storage Helper Methods
    function getUsers() {
      return JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '[]');
    }

    function saveUsers(users) {
      localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
    }

    function getCurrentUser() {
      const username = localStorage.getItem(STORAGE_KEYS.CURRENT_USER);
      if (!username) return null;
      const users = getUsers();
      return users.find(u => u.username.toLowerCase() === username.toLowerCase()) || null;
    }

    function setCurrentUserSession(username) {
      if (username) {
        localStorage.setItem(STORAGE_KEYS.CURRENT_USER, username);
      } else {
        localStorage.removeItem(STORAGE_KEYS.CURRENT_USER);
      }
      updateNavbar();
    }

    function updateUserProfile(updatedUser) {
      const users = getUsers();
      const index = users.findIndex(u => u.username.toLowerCase() === updatedUser.username.toLowerCase());
      if (index !== -1) {
        users[index] = updatedUser;
        saveUsers(users);
      }
    }

    // --- UI NAVIGATION & ROUTING ---
    function navigateTo(viewName, params = {}) {
      const app = document.getElementById('app-view');
      window.scrollTo(0, 0);

      switch (viewName) {
        case 'landing':
          app.innerHTML = renderLandingPage();
          break;
        case 'login':
          app.innerHTML = renderLoginPage();
          break;
        case 'register':
          app.innerHTML = renderRegisterPage();
          break;
        case 'dashboard':
          const user = getCurrentUser();
          if (!user) {
            showToast('Please login to access your Dashboard', 'warning');
            navigateTo('login');
            return;
          }
          app.innerHTML = renderDashboardPage(user, params);
          setTimeout(() => generateCardQRCode(user), 100);
          break;
        case 'public-card':
          app.innerHTML = renderPublicCardPage(params.username);
          setTimeout(() => {
            const pubUser = getUsers().find(u => u.username.toLowerCase() === (params.username || '').toLowerCase());
            if (pubUser) generateCardQRCode(pubUser, 'public-qr');
          }, 100);
          break;
        default:
          app.innerHTML = renderLandingPage();
      }
      updateNavbar();
    }

    function updateNavbar() {
      const nav = document.getElementById('nav-actions');
      const user = getCurrentUser();

      if (user) {
        nav.innerHTML = `
          <button onclick="navigateTo('dashboard')" class="text-sm font-semibold text-gray-300 hover:text-white flex items-center space-x-2 bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">
            <img src="${user.avatar}" class="w-6 h-6 rounded-full object-cover border border-brand-accent">
            <span>${user.name}</span>
          </button>
          <button onclick="handleLogout()" class="text-xs bg-red-950/60 hover:bg-red-900 border border-red-800 text-red-300 px-3 py-2 rounded-lg font-medium transition">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>
        `;
      } else {
        nav.innerHTML = `
          <button onclick="navigateTo('login')" class="text-sm font-semibold text-gray-300 hover:text-white px-3 py-2 transition">
            Log In
          </button>
          <button onclick="navigateTo('register')" class="text-sm font-semibold bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white px-4 py-2 rounded-lg shadow-lg shadow-indigo-600/30 transition">
            Create Account
          </button>
        `;
      }
    }

    // --- VIEWS GENERATOR ---

                <i class="fa-solid fa-id-badge mr-2"></i> CLAIM YOUR GAMER CARD

              <button onclick="navigateTo('login')" class="px-8 py-4 bg-gray-900 border border-gray-700 hover:border-gray-500 text-gray-200 font-semibold rounded-xl transition">
                Sign In to Existing Card

            </div>

            <!-- Preview Card Showcase -->
            <div class="mt-16 max-w-xl mx-auto text-left">
              <div class="holo-card border-2 border-indigo-500/40 rounded-2xl p-6 shadow-2xl backdrop-blur-xl relative">
                <div class="flex justify-between items-start mb-6">
                  <div class="flex items-center space-x-4">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" class="w-16 h-16 rounded-xl object-cover border-2 border-brand-accent shadow-md">
                    <div>
                      <h3 class="font-orbitron font-bold text-xl text-white">Alex Mercer <span class="text-xs bg-indigo-900 text-indigo-300 px-2 py-0.5 rounded border border-indigo-700 ml-2">LVL 12</span></h3>
                      <p class="text-sm text-cyan-400">@Striker99 • Master Tactician</p>
                      <p class="text-xs text-gray-400 mt-1">Cricket Nets • Football 5s • Valorant</p>
                    </div>
                  </div>
                  <div class="bg-white p-2 rounded-lg shadow-md">
                    <i class="fa-solid fa-qrcode text-4xl text-gray-900"></i>
                  </div>
                </div>

                <div class="grid grid-cols-3 gap-2 bg-gray-900/80 p-3 rounded-xl text-center border border-gray-800 mb-4">
                  <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold">Cricket Innings</p>
                    <p class="text-lg font-bold text-white">24 Matches</p>
                  </div>
                  <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold">Turf Goals</p>
                    <p class="text-lg font-bold text-white">18 Goals</p>
                  </div>

                </div>
              </div>
            </div>

            <!-- Features Grid -->
            <div class="mt-20 grid grid-cols-1 md:grid-cols-3 gap-6 text-left max-w-5xl mx-auto">
              <div class="bg-gray-900/60 border border-gray-800 p-6 rounded-2xl">
                <div class="w-12 h-12 bg-indigo-900/50 rounded-xl flex items-center justify-center text-indigo-400 text-xl mb-4">
                  <i class="fa-solid fa-qrcode"></i>
                </div>
                <h4 class="font-orbitron font-bold text-lg text-white mb-2">Instant QR Code Card</h4>
                <p class="text-sm text-gray-400">Scan anywhere on mobile to show your player identity, overall rank, and verifiable match achievements.</p>
              </div>

              <div class="bg-gray-900/60 border border-gray-800 p-6 rounded-2xl">
                <div class="w-12 h-12 bg-cyan-900/50 rounded-xl flex items-center justify-center text-cyan-400 text-xl mb-4">
                  <i class="fa-solid fa-cricket-bat-ball"></i>
                </div>
                <h4 class="font-orbitron font-bold text-lg text-white mb-2">Physical & Digital Games</h4>
                <p class="text-sm text-gray-400">Log innings, net practice sessions, 5-a-side football matches, or online ranked esports battles seamlessly.</p>
              </div>

              <div class="bg-gray-900/60 border border-gray-800 p-6 rounded-2xl">
                <div class="w-12 h-12 bg-purple-900/50 rounded-xl flex items-center justify-center text-purple-400 text-xl mb-4">
                  <i class="fa-solid fa-sliders"></i>
                </div>
                <h4 class="font-orbitron font-bold text-lg text-white mb-2">100% Customizable</h4>
                <p class="text-sm text-gray-400">Create custom sports or game profiles (e.g. Badminton, Apex Legends, Net Practicing) tailored to how you play.</p>

            </div>
          </div>
        </div>
      `;
    }

    // 2. Login View
    function renderLoginPage() {
      return `
        <div class="min-h-[80vh] flex items-center justify-center px-4">
          <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl relative">
            <div class="text-center mb-8">
              <div class="w-12 h-12 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mx-auto mb-3 text-2xl border border-indigo-500/30">

              <div class="bg-indigo-950/40 border border-indigo-900/50 p-3 rounded-xl text-xs text-indigo-300 flex items-center space-x-2">

              </div>

              <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-orbitron font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition">

            </form>

            <div class="mt-6 text-center text-xs text-gray-400">

    // 3. Register View
    function renderRegisterPage() {
      return `
        <div class="min-h-[85vh] flex items-center justify-center px-4 py-8">
          <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-6">
              <div class="w-12 h-12 rounded-xl bg-cyan-600/20 text-cyan-400 flex items-center justify-center mx-auto mb-3 text-2xl border border-cyan-500/30">
                <i class="fa-solid fa-address-card"></i>
              </div>
              <h2 class="text-2xl font-orbitron font-bold text-white">CREATE GAMER CARD</h2>
              <p class="text-xs text-gray-400 mt-1">Generate your personal scannable player passport</p>

            <form onsubmit="handleRegister(event)" class="space-y-4">

                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Full Name</label>

                  class="w-full bg-gray-950 border border-gray-800 rounded-xl py-2.5 px-4 text-sm text-white focus:outline-none focus:border-brand-accent transition">
              </div>

                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Email Address</label>
                <input type="email" id="reg-email" required placeholder="player@domain.com"

                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Primary Title / Role</label>
                <input type="text" id="reg-title" placeholder="e.g. Cricket All-Rounder / FPS Specialist"
                  class="w-full bg-gray-950 border border-gray-800 rounded-xl py-2.5 px-4 text-sm text-white focus:outline-none focus:border-brand-accent transition">

              <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 text-white font-orbitron font-bold rounded-xl shadow-lg transition mt-2">

    // 4. Main Player Dashboard & Card Generator View
    function renderDashboardPage(user, params) {
      const activeFilter = params.filterGame || 'all';
      const userAchievements = activeFilter === 'all' 
        ? user.achievements 
        : user.achievements.filter(a => a.gameId === activeFilter);

    // --- CARD QR CODE GENERATION ENGINE ---
    function generateCardQRCode(user, targetId = 'dashboard-qrcode') {
      const container = document.getElementById(targetId);
      if (!container) return;
      container.innerHTML = '';

      // URL pointing to public card view or payload summary
      const cardUrl = `${window.location.origin}${window.location.pathname}?user=${user.username}#public-card`;

      new QRCode(container, {
        text: cardUrl,
        width: targetId === 'public-qr' ? 64 : 76,
        height: targetId === 'public-qr' ? 64 : 76,
        colorDark: "#0b0f19",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // --- USER INTERACTION HANDLERS ---
    function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('login-username').value.trim();
      const passwordInput = document.getElementById('login-password').value.trim();

      const users = getUsers();
      const match = users.find(u => u.username.toLowerCase() === usernameInput.toLowerCase() && u.password === passwordInput);

      if (match) {
        setCurrentUserSession(match.username);
        showToast(`Welcome back, ${match.name}!`, 'success');
        navigateTo('dashboard');
      } else {
        showToast('Invalid Username or Password. Demo user is Striker99 / password123', 'error');
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const username = document.getElementById('reg-username').value.trim().replace(/\s+/g, '');
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();
      const title = document.getElementById('reg-title').value.trim() || 'Rookie Gamer';

      const users = getUsers();
      if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
        showToast('Username already taken. Choose another tag.', 'error');
        return;
      }

      const newUser = {
        username,
        name,
        email,
        password,
        bio: 'Fresh GamerCard user tracking sports and game stats.',
        avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${username}`,
        title,
        level: 1,
        xp: 100,
        customGames: [...DEFAULT_GAMES],
        achievements: []
      };

      users.push(newUser);
      saveUsers(users);
      setCurrentUserSession(newUser.username);
      
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      showToast('Gamer Card created successfully!', 'success');
      navigateTo('dashboard');
    }

      e.preventDefault();
      const user = getCurrentUser();
      const gameId = document.getElementById('log-game-id').value;
      const game = user.customGames.find(g => g.id === gameId);

      const newLog = {
        id: Date.now(),

    function submitCustomGame(e) {
      e.preventDefault();
      const user = getCurrentUser();
      const name = document.getElementById('custom-game-name').value.trim();
      const type = document.getElementById('custom-game-category').value;
      const rawTypes = document.getElementById('custom-game-types').value.trim();

      const gameTypes = rawTypes ? rawTypes.split(',').map(t => t.trim()) : ['Self Play', 'Team Match', 'Practice'];

      const gameId = name.toLowerCase().replace(/[^a-z0-9]/g, '');

      if (user.customGames.some(g => g.id === gameId)) {
        showToast('Game category already exists!', 'warning');
        return;

      user.customGames.push({
        id: gameId,
        name,
        type,
        icon: type === 'Physical Sport' ? 'fa-person-running' : 'fa-gamepad',
        types: gameTypes
      });

      updateUserProfile(user);
      closeModal();
      showToast(`Added "${name}" category!`, 'success');
      navigateTo('dashboard');

      modal.innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-orbitron font-bold text-lg text-white"><i class="fa-solid fa-pen text-indigo-400 mr-1"></i> Edit Gamer Profile</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form onsubmit="submitEditProfile(event)" class="space-y-4 text-left">
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Display Name</label>
            <input type="text" id="edit-name" value="${user.name}" required class="w-full bg-gray-950 border border-gray-800 rounded-xl py-2 px-3 text-xs text-white focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Title / Speciality</label>
            <input type="text" id="edit-title" value="${user.title || ''}" class="w-full bg-gray-950 border border-gray-800 rounded-xl py-2 px-3 text-xs text-white focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Bio / Tagline</label>
            <textarea id="edit-bio" rows="2" class="w-full bg-gray-950 border border-gray-800 rounded-xl py-2 px-3 text-xs text-white focus:outline-none">${user.bio || ''}</textarea>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Avatar Image URL</label>
            <input type="url" id="edit-avatar" value="${user.avatar}" class="w-full bg-gray-950 border border-gray-800 rounded-xl py-2 px-3 text-xs text-white focus:outline-none">
          </div>

          <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-orbitron font-bold text-xs rounded-xl shadow-lg">
            UPDATE CARD DETAILS
          </button>
        </form>
      `;

      document.getElementById('global-modal').classList.remove('hidden');
    }

    function submitEditProfile(e) {
      e.preventDefault();
      const user = getCurrentUser();
      user.name = document.getElementById('edit-name').value.trim();
      user.title = document.getElementById('edit-title').value.trim();
      user.bio = document.getElementById('edit-bio').value.trim();
      user.avatar = document.getElementById('edit-avatar').value.trim() || user.avatar;

      updateUserProfile(user);
      closeModal();
      showToast('Profile updated!', 'success');
      navigateTo('dashboard');
    }

    // --- HELPER UTILITIES ---
    function showToast(message, type = 'info') {
      const toastContainer = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const colors = {
        success: 'bg-emerald-950 border-emerald-700 text-emerald-200',
        error: 'bg-red-950 border-red-700 text-red-200',
        warning: 'bg-amber-950 border-amber-700 text-amber-200',
        info: 'bg-indigo-950 border-indigo-700 text-indigo-200'
      };

      toast.className = `pointer-events-auto flex items-center space-x-2 px-4 py-3 rounded-xl border text-xs shadow-xl transition transform duration-300 ${colors[type] || colors.info}`;
      toast.innerHTML = `<span>${message}</span>`;

      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function downloadCardAsJSON(username) {
      const user = getUsers().find(u => u.username === username);
      if (!user) return;

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(user, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `GamerCard_${username}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('Gamer Card exported as JSON file', 'success');
    }

    // Check URL parameters for direct public view sharing
    function checkUrlRoutes() {
      const urlParams = new URLSearchParams(window.location.search);
      const sharedUser = urlParams.get('user');
      if (sharedUser) {
        navigateTo('public-card', { username: sharedUser });
      } else {
        navigateTo('landing');
      }
    }

    // Initialize App On Load
    window.onload = function() {
      seedInitialData();
      checkUrlRoutes();
    };
  </script>
</body>
</html>
